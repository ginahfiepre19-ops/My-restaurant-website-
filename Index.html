<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mama Gold Kitchen - Yenagoa</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family: sans-serif;}
body{background:#fff8f0;}
header{background:#ff6600; color:white; padding:15px; text-align:center; font-size:20px; font-weight:bold;}
.hero{padding:20px; text-align:center;}
.hero img{width:100%; max-width:400px; border-radius:15px; margin:15px 0;}
.hero h2{color:#333; margin:10px 0;}
.hero p{color:#666; margin-bottom:15px;}
.btn{background:#ff6600; color:white; padding:12px 25px; border:none; border-radius:25px; font-size:16px; font-weight:bold;}
.menu{display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:20px;}
.card{background:white; padding:15px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); text-align:center;}
.card img{width:100%; border-radius:10px; height:100px; object-fit:cover;}
.card h3{margin:10px 0 5px; font-size:15px;}
.card p{color:#ff6600; font-weight:bold;}
.order-btn{background:#25D366; color:white; border:none; padding:6px 12px; border-radius:15px; margin-top:8px; font-size:12px;}
footer{background:#222; color:white; text-align:center; padding:20px; margin-top:20px;}
</style>
</head>
<body>

<header>MAMA GOLD KITCHEN - YENAGOA</header>

<div class="hero">
  <!-- Hero image - person eating -->
  <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500" alt="Person enjoying food">
  <h2>Fresh, Hot Food Wey Sweet Die!</h2>
  <p>We dey deliver for everywhere for Yenagoa - fast fast!</p>
  <a href="https://wa.me/2348012345678?text=Hello%2C%20I%20want%20to%20order%20food">
    <button class="btn">Order on WhatsApp Now</button>
  </a>
</div>

<div class="menu">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=300" alt="Jollof">
    <h3>Jollof + Chicken</h3>
    <p>₦3,500</p>
    <a href="https://wa.me/2348012345678?text=I%20want%20to%20order%20Jollof%20Rice%20%2B%20Chicken%20N3500">
      <button class="order-btn">Order</button>
    </a>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1547592180-85f173990554?w=300" alt="Swallow">
    <h3>Swallow + Soup</h3>
    <p>₦2,500</p>
    <a href="https://wa.me/2348012345678?text=I%20want%20to%20order%20Swallow%20and%20Soup%20N2500">
      <button class="order-btn">Order</button>
    </a>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1521390188846-e2a3a97453a0?w=300" alt="Shawarma">
    <h3>Shawarma Special</h3>
    <p>₦2,000</p>
    <a href="https://wa.me/2348012345678?text=I%20want%20to%20order%20Shawarma%20N2000">
      <button class="order-btn">Order</button>
    </a>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=300" alt="Burger">
    <h3>Chicken Burger</h3>
    <p>₦2,800</p>
    <a href="https://wa.me/2348012345678?text=I%20want%20to%20order%20Chicken%20Burger%20N2800">
      <button class="order-btn">Order</button>
    </a>
  </div>
</div>

<footer>
  📍 Opposite Bayelsa Plaza, Yenagoa<br>
  📞 08030900487<br>
  Open Daily 8am - 10pm
</footer>

</body>
</html>
